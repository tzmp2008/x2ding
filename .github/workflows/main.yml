name: Twitter Monitor

on:
  schedule:
    # 时区说明：cron 一律是 UTC。北京时间 = UTC+8。
    #   UTC 00:00 = 北京 08:00   UTC 14:00 = 北京 22:00
    #
    # 三条错开相位的 cron 只是"多重抽签"，用来提高被 GitHub 调度器捞到的概率。
    # GitHub 的 schedule 是 best-effort，会延迟甚至丢事件，别指望它们准点。
    # 真正保证 30 分钟节奏的是外部触发器（trigger-monitor.ps1 / .sh）。
    #
    # 若只想在"北京时间 08:00-22:00"监控，把三条都改成：
    #   - cron: '*/30 0-14 * * *'
    - cron: '*/30 * * * *'
    - cron: '7,37 * * * *'
    - cron: '17,47 * * * *'

  workflow_dispatch:

# 并发闸门：外部触发器和 cron 可能同时打进来，这里保证同一时刻只有一个 monitor 在跑。
# 后到的请求会排队等待，而不是两个 job 同时 git push last_id.json 互相打架。
concurrency:
  group: twitter-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run monitor script
        env:
          TWITTER_USER: ${{ secrets.TWITTER_USER }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          CLOUDFLARE_PROXY: ${{ secrets.CLOUDFLARE_PROXY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          LOOP_MODE: 'false'
        run: python twitter_monitor.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add last_id.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update last_id.json [skip ci]"
            # 拉一次再推，避免外部触发器密集时出现 non-fast-forward
            git pull --rebase --autostash || true
            git push
          fi
